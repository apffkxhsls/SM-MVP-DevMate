<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="../../static/css/style.css"
          th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="../../static/css/projects.css"
          th:href="@{/css/projects.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 활동 | DevMate</title>
</head>
<body>
<header class="site-header">
    <nav class="nav-container" aria-label="주 메뉴">
        <a class="logo" href="/projects" th:href="@{/projects}">DevMate</a>
        <!-- 메뉴와 로그아웃 버튼을 가로로 묶는 래퍼 -->
        <div class="nav-right">
            <div class="nav-menu">
                <a class="nav-link" href="/projects" th:href="@{/projects}">팀 찾기</a>
                <a class="nav-link" href="/projects/new" th:href="@{/projects/new}">모집글 작성</a>
                <a class="nav-link active"
                   href="/my/applications"
                   th:href="@{/my/applications}"
                   aria-current="page">내 활동</a>
                <a class="nav-link" href="/profile" th:href="@{/profile}">내 프로필</a>
            </div>
            <!-- CSRF 토큰은 th:action이 자동으로 추가 -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="nav-logout">로그아웃</button>
            </form>
        </div>
    </nav>
</header>

<main class="page-content">
    <h1 class="page-title">내 활동</h1>

    <!-- 내 지원 / 내 모집글 탭 전환 -->
    <div class="activity-tabs">
        <a class="activity-tab"
           href="/my/applications"
           th:href="@{/my/applications}">내 지원</a>
        <a class="activity-tab activity-tab--active"
           href="/my/projects"
           th:href="@{/my/projects}"
           aria-current="page">내 모집글</a>
    </div>

    <!-- 모집글 카드 목록 -->
    <!-- 백엔드 연동 시: th:if="${!projectPage.empty}" 조건 추가 -->
    <div class="my-project-list">

        <!-- 목업: 지원자 있는 카드 -->
        <!-- 백엔드 연동 시: th:each="card : ${projectPage.content}" -->
        <div class="my-project-card">
            <div class="my-project-card__header">
                <!-- 백엔드 연동 시: th:class 로 상태 분기 -->
                <span class="status-badge status-badge--open">모집 중</span>
                <!-- 백엔드 연동 시: th:text="${card.title}" -->
                <h2 class="my-project-card__title">AI 기반 일정 관리 서비스</h2>
                <p class="my-project-card__meta">
                    <span>프론트엔드</span>
                    <span class="info-dot">·</span>
                    <span>React</span>
                    <span class="info-dot">·</span>
                    <span>마감 2026.11.30</span>
                </p>
            </div>

            <!-- 지원자 섹션 -->
            <div class="applicant-section">
                <!-- 백엔드 연동 시: th:text="${card.applicantCount} + '명'" -->
                <p class="applicant-section__count">지원자 2명</p>
                <ul class="applicant-list">
                    <!-- 백엔드 연동 시: th:each="applicant : ${card.applicants}" -->
                    <li class="applicant-item">
                        <!-- 백엔드 연동 시: th:text="${applicant.name}" -->
                        <span class="applicant-name">김민준</span>
                        <div class="applicant-actions">
                            <!-- 백엔드 연동 시: PATCH /applications/{id}/accept -->
                            <button type="button" class="btn-accept">수락</button>
                            <!-- 백엔드 연동 시: PATCH /applications/{id}/reject -->
                            <button type="button" class="btn-reject">거절</button>
                        </div>
                    </li>
                    <li class="applicant-item">
                        <span class="applicant-name">이서연</span>
                        <div class="applicant-actions">
                            <button type="button" class="btn-accept">수락</button>
                            <button type="button" class="btn-reject">거절</button>
                        </div>
                    </li>
                </ul>
                <div class="applicant-section__footer">
                    <!-- 백엔드 연동 시: PATCH /projects/{id}/close -->
                    <button type="button" class="btn-close-recruitment">모집 마감</button>
                </div>
            </div>
        </div>

        <!-- 목업: 지원자 없는 카드 -->
        <div class="my-project-card">
            <div class="my-project-card__header">
                <span class="status-badge status-badge--open">모집 중</span>
                <h2 class="my-project-card__title">모바일 쇼핑 앱</h2>
                <p class="my-project-card__meta">
                    <span>Android</span>
                    <span class="info-dot">·</span>
                    <span>Kotlin</span>
                    <span class="info-dot">·</span>
                    <span>마감 2026.12.15</span>
                </p>
            </div>
            <div class="applicant-section">
                <p class="applicant-section__count">지원자 0명</p>
                <p class="applicant-section__empty">아직 지원자가 없습니다.</p>
                <div class="applicant-section__footer">
                    <button type="button" class="btn-close-recruitment">모집 마감</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 모집글 없을 때 -->
    <!-- 백엔드 연동 시: th:if="${projectPage.totalElements == 0}" 로 조건 처리 -->
    <!-- <p class="empty-state">작성한 모집글이 없습니다.</p> -->

    <!-- 페이지네이션 -->
    <!-- 백엔드 연동 시: project/list.html 의 pagination 패턴 그대로 적용 -->

</main>
</body>
</html>
