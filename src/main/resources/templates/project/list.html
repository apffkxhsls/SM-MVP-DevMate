<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="../../static/css/style.css"
          th:href="@{/css/style.css}">
    <link rel="stylesheet"
      href="../../static/css/project-list.css"
      th:href="@{/css/project-list.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 찾기 | DevMate</title>
</head>

<body>
<header class="site-header">
    <nav class="nav-container" aria-label="주 메뉴">
        <a class="logo" href="/projects" th:href="@{/projects}">DevMate</a>
        <div class="nav-menu">
            <a class="nav-link active"
               href="/projects"
               th:href="@{/projects}"
               aria-current="page">팀 찾기</a>
            <a class="nav-link" href="/projects/new" th:href="@{/projects/new}">모집글 작성</a>
            <a class="nav-link" href="/my/applications" th:href="@{/my/applications}">내 활동</a>
            <a class="nav-link" href="/profile" th:href="@{/profile}">내 프로필</a>
        </div>
    </nav>
</header>

<main class="page-content">
    <h1 class="page-title">나에게 맞는 프로젝트</h1>

    <!-- 프로필 미작성 시 안내 배너 -->
    <div th:if="${profileRequired}" class="profile-required-banner" role="alert">
    프로필을 작성해야 정확한 추천을 받을 수 있어요.
    <a href="/profile" th:href="@{/profile}">프로필 작성하러 가기</a>
    </div>

    <!-- 판정 상태 탭 -->
    <div class="status-tabs">
    <a class="status-tab"
       th:classappend="${selectedStatus.name() == 'PASS'} ? 'status-tab--active'"
       th:href="@{/projects(status='PASS', page=0)}"
       href="/projects?status=PASS">충족</a>
    <a class="status-tab"
       th:classappend="${selectedStatus.name() == 'FAIL'} ? 'status-tab--active'"
       th:href="@{/projects(status='FAIL', page=0)}"
       href="/projects?status=FAIL">미충족</a>
    <a class="status-tab"
       th:classappend="${selectedStatus.name() == 'UNKNOWN'} ? 'status-tab--active'"
       th:href="@{/projects(status='UNKNOWN', page=0)}"
       href="/projects?status=UNKNOWN">확인 필요</a>
</div>

<div class="project-list">
    <!-- th:each: projectPage.content 목록에서 카드 하나씩 꺼내 반복 -->
    <div class="project-card" th:each="card : ${projectPage.content}">
        <h2 th:text="${card.title}">프로젝트 제목</h2>

        <!-- 모집 역할 한국어 변환 -->
        <p>
            <!-- 모집 역할 -->
            <span th:switch="${card.role.name()}">
                <span th:case="'FRONTEND'">프론트엔드</span>
                <span th:case="'BACKEND'">백엔드</span>
                <span th:case="'ANDROID'">Android</span>
                <span th:case="'IOS'">iOS</span>
                <span th:case="'AI'">AI</span>
            </span>
            <!-- 필수 기술 (각 기술 앞에 · 붙임) -->
            <span th:each="skill : ${card.requiredSkills}">
                <span th:switch="${skill.name()}">
                    <span th:case="'JAVA'"> · Java</span>
                    <span th:case="'KOTLIN'"> · Kotlin</span>
                    <span th:case="'PYTHON'"> · Python</span>
                    <span th:case="'JAVASCRIPT'"> · JavaScript</span>
                    <span th:case="'SPRING_BOOT'"> · Spring Boot</span>
                    <span th:case="'REACT'"> · React</span>
                </span>
            </span>
            <!-- 협업 방식 -->
            <span th:text="${card.meetingType.name() == 'OFFLINE'} ? ' · 대면' : ' · 비대면'"></span>
        </p>


        <!-- PASS일 때만 적합도 점수 표시 -->
        <strong th:if="${card.match.status.name() == 'PASS'}"
                th:text="'적합도 ' + ${card.match.score} + '점'">적합도 00점</strong>

        <!-- 판정 사유 목록 -->
        <p class="match-summary">
            <span th:each="reason, iter : ${card.match.reasons}">
                <span th:text="${reason}">사유</span>
                <span th:if="${!iter.last}"> · </span>
            </span>
        </p>

        <!-- 상세 보기 링크: 실제 projectId로 이동 -->
        <a th:href="@{/projects/{id}(id=${card.projectId})}"
           href="/projects/1"
           th:attr="aria-label=${card.title} + ' 상세 보기'"
           class="detail-link">
            상세 보기
        </a>
    </div>
</div>

<div class="project-list">
    <!-- 결과 없을 때 안내 메시지 -->
    <p th:if="${projectPage.totalElements == 0}" class="empty-state">
        해당 조건의 프로젝트가 없습니다.
    </p>

    <div class="project-card" th:each="card : ${projectPage.content}">
        ...
    </div>
</div>


<!-- 페이지네이션 -->
<nav class="pagination" aria-label="페이지 이동">
    
    <!-- 페이지 개수 1개 인 경우 페이지네이션 숨김 -->
    <nav class="pagination" th:if="${projectPage.totalPages > 1}" aria-label="페이지 이동">

    <!-- 이전 버튼: 첫 페이지면 숨김 -->
    <a class="pagination-btn"
       th:if="${!projectPage.first}"
       th:href="@{/projects(status=${selectedStatus}, page=${projectPage.number - 1})}">
        이전
    </a>

    <!-- 현재 페이지 / 전체 페이지 -->
    <span class="pagination-info"
          th:text="${projectPage.number + 1} + ' / ' + ${projectPage.totalPages}">
        1 / 3
    </span>

    <!-- 다음 버튼: 마지막 페이지면 숨김 -->
    <a class="pagination-btn"
       th:if="${!projectPage.last}"
       th:href="@{/projects(status=${selectedStatus}, page=${projectPage.number + 1})}">
        다음
    </a>
</nav>


</main>
</body>
</html>
