<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="../../static/css/projects.css" th:href="@{/css/projects.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지원자 목록 | DevMate</title>
</head>

<body>
    <header class="site-header">
        <nav class="nav-container" aria-label="주 메뉴">
            <a class="logo" href="/projects" th:href="@{/projects}">DevMate</a>
            <!-- 메뉴와 로그아웃 버튼을 가로로 묶는 래퍼 -->
            <div class="nav-right">
                <div class="nav-menu">
                    <a class="nav-link" href="/projects" th:href="@{/projects}">팀 찾기</a>
                    <a class="nav-link" href="/projects/new" th:href="@{/projects/new}">모집글 작성</a>
                    <a class="nav-link active" href="/my/applications" th:href="@{/my/applications}"
                        aria-current="page">내 활동</a>
                    <a class="nav-link" href="/profile" th:href="@{/profile}">내 프로필</a>
                </div>
                <!-- CSRF 토큰은 th:action이 자동으로 추가 -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-logout">로그아웃</button>
                </form>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <!-- 수락/거절 처리 후 플래시 메시지 -->
        <div th:if="${successMessage}" class="success-banner" role="status">
            <span th:text="${successMessage}">지원자를 수락했습니다.</span>
        </div>
        <div th:if="${errorMessage}" class="error-banner" role="alert">
            <span th:text="${errorMessage}">오류 메시지</span>
        </div>

        <!-- 제목 + 돌아가기 버튼 -->
        <div class="page-header">
            <h1 class="page-title">지원자 목록</h1>
            <a href="/my/projects" th:href="@{/my/projects}" class="back-link">내 모집글로 돌아가기</a>
        </div>


        <!-- 지원자 없을 때 -->
        <p th:if="${applicationPage.totalElements == 0}" class="empty-state">아직 지원자가 없습니다.</p>

        <!-- 지원자 목록 -->
        <ul class="applicant-list" th:if="${applicationPage.totalElements > 0}">
            <li class="applicant-item" th:each="app : ${applicationPage.content}">
                <!-- 지원자 이름 -->
                <span class="applicant-name" th:text="${app.applicantName}">지원자 이름</span>
                <!-- 상태 뱃지 -->
                <span th:with="s=${app.status.name()}" th:class="${s == 'PENDING'} ? 'status-badge status-badge--pending'
                      : (${s == 'ACCEPTED'} ? 'status-badge status-badge--accepted'
                      : 'status-badge status-badge--rejected')"
                    th:text="${s == 'PENDING'} ? '대기중' : (${s == 'ACCEPTED'} ? '수락' : '거절')">상태</span>
                <!-- 대기 중일 때만 수락/거절 버튼 표시 -->
                <div class="applicant-actions" th:if="${app.status.name() == 'PENDING'}">
                    <form th:action="@{/applications/{id}/accept(id=${app.applicationId})}" method="post">
                        <button type="submit" class="btn-accept">수락</button>
                    </form>
                    <form th:action="@{/applications/{id}/reject(id=${app.applicationId})}" method="post">
                        <button type="submit" class="btn-reject">거절</button>
                    </form>
                </div>
            </li>
        </ul>

        <!-- 페이지가 2개 이상일 때만 페이지네이션 표시 -->
        <nav class="pagination" th:if="${applicationPage.totalPages > 1}" aria-label="페이지 이동">
            <a class="pagination-btn" th:if="${!applicationPage.first}"
                th:href="@{/projects/{id}/applications(id=${projectId}, page=${applicationPage.number - 1})}">이전</a>
            <span class="pagination-info"
                th:text="${applicationPage.number + 1} + ' / ' + ${applicationPage.totalPages}">1 / 3</span>
            <a class="pagination-btn" th:if="${!applicationPage.last}"
                th:href="@{/projects/{id}/applications(id=${projectId}, page=${applicationPage.number + 1})}">다음</a>
        </nav>
    </main>
</body>

</html>
