<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="../../static/css/style.css"
          th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="../../static/css/applications.css"
          th:href="@{/css/applications.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 활동 | DevMate</title>
</head>
<body>
<header class="site-header">
    <nav class="nav-container" aria-label="주 메뉴">
        <a class="logo" href="/projects" th:href="@{/projects}">DevMate</a>
        <div class="nav-menu">
            <a class="nav-link" href="/projects" th:href="@{/projects}">팀 찾기</a>
            <a class="nav-link" href="/projects/new" th:href="@{/projects/new}">모집글 작성</a>
            <a class="nav-link active"
               href="/my/applications"
               th:href="@{/my/applications}"
               aria-current="page">내 활동</a>
            <a class="nav-link" href="/profile" th:href="@{/profile}">내 프로필</a>
        </div>
    </nav>
</header>

<main class="page-content">
    <h1 class="page-title">내 활동</h1>

    <!-- 내 지원 / 내 모집글 탭 전환 -->
    <div class="activity-tabs">
        <a class="activity-tab activity-tab--active"
           href="/my/applications"
           th:href="@{/my/applications}"
           aria-current="page">내 지원</a>
        <a class="activity-tab"
           href="/my/projects"
           th:href="@{/my/projects}">내 모집글</a>
    </div>

    <!-- 지원 카드 목록 -->
    <div class="application-list">

        <!-- 지원 내역 없을 때 -->
        <p th:if="${applicationPage.totalElements == 0}" class="empty-state">
            지원한 프로젝트가 없습니다.
        </p>

        <!-- applicationPage.content 목록에서 카드 하나씩 꺼내 반복 -->
        <!-- 카드 제목, 정보, 상태 뱃지, 링크는 다음 단계에서 연동 예정 -->
        <div class="application-card" th:each="card : ${applicationPage.content}">
            <div class="application-card__left">
                <h2 class="application-card__title" th:text="${card.projectTitle}">프로젝트 제목</h2>
                <p class="application-card__info">
                    <span th:text="${#temporals.format(card.createdAt, 'yyyy.MM.dd')}">지원일</span>
                </p>
            </div>
            <div class="application-card__right">
                <span th:with="s=${card.status.name()}"
                    th:class="${s == 'PENDING'} ? 'status-badge status-badge--pending'
                        : (${s == 'ACCEPTED'} ? 'status-badge status-badge--accepted'
                        : 'status-badge status-badge--rejected')"
                    th:text="${s == 'PENDING'} ? '대기중' : (${s == 'ACCEPTED'} ? '수락' : '거절')">상태
                </span>
                <a href="/projects/1" class="application-detail-link">상세 보기</a>
            </div>
            

        </div>

    </div>

    <!-- 페이지네이션 -->
    <!-- 페이지네이션은 다음 단계에서 연동 예정 -->

</main>
</body>
</html>
