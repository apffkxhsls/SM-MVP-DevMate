<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="../../static/css/profile.css"
          th:href="@{/css/profile.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 | DevMate</title>
</head>
<body>
<main class="profile-page">
    <div class="profile-header">
        <h1>내 프로필</h1>
        
        <!-- 저장 전에만 표시: 저장 완료 후 사라짐 -->
        <a th:unless="${successMessage}" 
            href="/projects" th:href="@{/projects}" 
            class="back-link">프로필 작성 취소</a>
    </div>

    <!-- 저장 성공 시 플래시 메시지 -->
    <div th:if="${successMessage}" class="success-banner">
        <p th:text="${successMessage}">프로필이 저장되었습니다.</p>
        <a href="/projects" th:href="@{/projects}" class="btn-projects">팀 찾기로 돌아가기</a>
        
    </div>

    <p>기술 스택과 활동 가능한 시간을 알려주세요.</p>

    <!-- POST /profile → ProfileController.save() → 성공 시 /profile로 리다이렉트 -->
    <form class="profile-form"
      th:object="${profileForm}"
      th:action="@{/profile}"
      method="post">
        <fieldset>
            <legend>역할 및 기술</legend>

            <div class="form-field">
                <label for="role">희망 역할</label>
                <select id="role" th:field="*{role}">
                    <option value="">역할을 선택하세요</option>
                    <option value="FRONTEND">프론트엔드</option>
                    <option value="BACKEND">백엔드</option>
                    <option value="ANDROID">Android</option>
                    <option value="IOS">iOS</option>
                    <option value="AI">AI</option>
                </select>
                <!-- 서버 검증 실패 시 오류 메시지 표시 -->
                <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="field-error"></p>
            </div>

            <fieldset class="skill-options">
                <!-- th:field로 컬렉션 바인딩: 서버 반환 시 기존 선택값 유지 -->
                <legend>보유 기술 스택 — 여러 개 선택 가능</legend>

                <label>
                    <input type="checkbox" th:field="*{skills}" value="JAVA">
                    Java
                </label>
                <label>
                    <input type="checkbox" th:field="*{skills}" value="KOTLIN">
                    Kotlin
                </label>
                <label>
                    <input type="checkbox" th:field="*{skills}" value="PYTHON">
                    Python
                </label>
                <label>
                    <input type="checkbox" th:field="*{skills}" value="JAVASCRIPT">
                    JavaScript
                </label>
                <label>
                    <input type="checkbox" th:field="*{skills}" value="SPRING_BOOT">
                    Spring Boot
                </label>
                <label>
                    <input type="checkbox" th:field="*{skills}" value="REACT">
                    React
                </label>
            </fieldset>
            <!-- skills 오류: JS validateSkills()가 처리 -->
            <p id="skillsError" class="field-error" aria-live="polite"></p>
        </fieldset>

        <fieldset>
            <legend>활동 시간</legend>

            <div class="form-field">
                <label for="weeklyHours">주당 투자 가능 시간</label>
                <input
                        type="number"
                        id="weeklyHours"
                        th:field="*{weeklyHours}"
                        min="1"
                        max="168"
                        step="1"
                        placeholder="예: 6"
                >
                <p th:if="${#fields.hasErrors('weeklyHours')}" th:errors="*{weeklyHours}" class="field-error"></p>
            </div>

            <div class="form-field">
                <p id="availabilityTitle">활동 가능 시간대</p>
                <p id="availabilityHelp">
                    한국 시간 기준으로 참여 가능한 시간을 선택하세요.
                    각 칸은 1시간입니다.
                </p>

                <div class="time-table-wrapper"
                     role="region"
                     aria-labelledby="availabilityTitle"
                     tabindex="0">
                    <table class="time-table"
                           aria-labelledby="availabilityTitle"
                           aria-describedby="availabilityHelp">
                        <thead>
                        <tr>
                            <th scope="col">시간</th>
                            <th scope="col">월</th>
                            <th scope="col">화</th>
                            <th scope="col">수</th>
                            <th scope="col">목</th>
                            <th scope="col">금</th>
                            <th scope="col">토</th>
                            <th scope="col">일</th>
                        </tr>
                        </thead>

                        <tbody id="timeTableBody"></tbody>
                    </table>
                </div>

                <p id="selectedTimeCount" aria-live="polite">
                    선택한 시간: 주 0시간
                </p>
                <!-- availableSlots 오류: JS validateAvailableSlots()가 처리 -->
                <p id="availableSlotsError" class="field-error" aria-live="polite"></p>
            </div>
        </fieldset>

        <fieldset>
            <legend>프로젝트 목표 및 지역</legend>

            <div class="form-field">
                <label for="goal">희망 목표</label>
                <select id="goal" th:field="*{goal}">
                    <option value="">목표를 선택하세요</option>
                    <option value="CONTEST">대회 출전</option>
                    <option value="PORTFOLIO">포트폴리오</option>
                    <option value="SERVICE">실제 서비스 운영</option>
                </select>
                <p th:if="${#fields.hasErrors('goal')}" th:errors="*{goal}" class="field-error"></p>
            </div>

            <div class="form-field">
                <label for="region">대면 가능 지역</label>
                <input
                        type="text"
                        id="region"
                        th:field="*{region}"
                        placeholder="예: 서울특별시 용산구"
                        aria-describedby="regionHelp"
                >
                <!-- region 오류: 100자 초과 시 (@Size) -->
                <p th:if="${#fields.hasErrors('region')}" th:errors="*{region}" class="field-error"></p>
                <p id="regionHelp">
                    대면 활동 시 필수사항으로 활동이 가능한 지역을 입력해주세요.
                </p>
            </div>
        </fieldset>

        <fieldset>
            <legend>추가 소개</legend>

            <div class="form-field">
                <label for="portfolioUrl">포트폴리오 링크</label>
                <input
                        type="url"
                        id="portfolioUrl"
                        th:field="*{portfolioUrl}"
                        placeholder="https://github.com/사용자명"
                >
                <!-- portfolioUrl 오류: 2000자 초과 또는 URL 형식 불일치 시 -->
                <p th:if="${#fields.hasErrors('portfolioUrl')}" th:errors="*{portfolioUrl}" class="field-error"></p>
            </div>

            <div class="form-field">
                <label for="introduction">자기소개</label>
                <textarea
                        id="introduction"
                        th:field="*{introduction}"
                        rows="5"
                        placeholder="프로젝트 경험이나 관심 분야를 소개해주세요."
                ></textarea>
                <!-- introduction 오류: 1000자 초과 시 (@Size) -->
                <p th:if="${#fields.hasErrors('introduction')}" th:errors="*{introduction}" class="field-error"></p>
            </div>
        </fieldset>

        <button type="submit">
            프로필 저장
        </button>
    </form>
</main>

<!--
    서버 검증 오류로 폼이 재렌더링될 때 time-selector.js가 시간대를 복원할 수 있도록
    Thymeleaf 인라인으로 기존 선택값을 JS 배열로 전달한다.
    th:object 범위 밖이므로 ${profileForm.availableSlots} 사용
-->
<script th:inline="javascript">
    /*<![CDATA[*/
    var preselectedSlots = /*[[${profileForm.availableSlots}]]*/ [];
    /*]]>*/
</script>

<script src="../../static/js/time-selector.js"
        th:src="@{/js/time-selector.js}"></script>
<script src="../../static/js/profile-form.js"
        th:src="@{/js/profile-form.js}"></script>
</body>
</html>
